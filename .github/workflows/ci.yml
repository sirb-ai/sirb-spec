name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs, but let every main build finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: npm test (node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  conformance-python:
    # Second, independent validator: the suite must not depend on Ajv quirks.
    name: conformance (python-jsonschema)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes --no-deps --only-binary ':all:' -r conformance/runners/python/requirements.txt
      - run: python -I conformance/runners/python/run_conformance.py .

  gitleaks:
    name: secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.24.0
      GITLEAKS_SHA256: cb49b7de5ee986510fe8666ca0273a6cc15eb82571f2f14832c9e8920751f3a4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks (checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
      - run: ./gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 .
      - name: Check the allowlist does not hide real keys
        # The canary is assembled at run time so this file never contains it.
        run: |
          canary="ghp_$(printf 'aB3dE5fG7h%s' 'J9kL1mN3pQ5rS7tU9vW1xY3zA5')"
          printf '{"token": "%s"}\n' "$canary" > conformance/fixtures/zz-canary.json
          if ./gitleaks dir --config .gitleaks.toml --redact --no-banner conformance/fixtures; then
            echo "::error::gitleaks did not report a real-looking key in a fixture"
            exit 1
          fi
          rm conformance/fixtures/zz-canary.json
